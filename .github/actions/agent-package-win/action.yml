    #    packaging\windows\codesign_client.exe --debug %KLOGG_BUILD_ROOT%\output\tbbmalloc_proxy.dll
    
    - name: Stage Windows package files
      shell: cmd
      run: |
        cmake --build %KLOGG_BUILD_ROOT% --target klogg_portable_folder
        if exist release rmdir /s /q release
        xcopy /e /i /y "%KLOGG_BUILD_ROOT%\portable\RelWithDebInfo\ZzLogg-portable" release
        xcopy /y "%KLOGG_BUILD_ROOT%\output\ZzLogg.exe" release\
        xcopy /y "%KLOGG_BUILD_ROOT%\output\klogg_crashpad_handler.exe" release\
        xcopy /y "%KLOGG_BUILD_ROOT%\output\klogg_minidump_dump.exe" release\
        xcopy /y "%KLOGG_BUILD_ROOT%\generated\documentation.html" release\

    - name: Win installer
      uses: joncloud/makensis-action@v3.3
      with:
        script-file: packaging/windows/ZzLogg.nsi
        arguments: "-DVERSION=%KLOGG_VERSION% -DPLATFORM=%KLOGG_ARCH%"
    
    - name: Win package
      shell: cmd
      run: |
        md %KLOGG_BUILD_ROOT%\packages
        xcopy /e /i /y "%KLOGG_BUILD_ROOT%\portable\RelWithDebInfo\ZzLogg-portable" "%KLOGG_BUILD_ROOT%\packages\ZzLogg-%KLOGG_VERSION%-%KLOGG_ARCH%-Qt6-portable"
        xcopy "ZzLogg-%KLOGG_VERSION%-%KLOGG_ARCH%-Qt6-setup.exe" "%KLOGG_BUILD_ROOT%\packages" /y

