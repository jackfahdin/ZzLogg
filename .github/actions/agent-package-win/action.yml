name: "Prepare windows packages"
description: "Build Windows installer and portable packages"
inputs:
  # 签名链路当前整体注释（见下方被注释的 codesign 步骤），三个 s3 input
  # 实际未被消费，仅作声明；改可选以便无签名机密的 workflow/fork 复用本 action。
  s3-key-id:
    required: false
  s3-secret:
    required: false
  s3-bucket:
    required: false
runs:
  using: "composite"
  steps:
    #- name: Setup codesing env
    #  if: ${{ github.event_name != 'pull_request' }}
    #  shell: sh
    #  run: |
    #    echo "CS_CLIENT_S3_KEY_ID=${{ inputs.s3-key-id }}" >> $GITHUB_ENV 
    #    echo "CS_CLIENT_S3_SECRET=${{ inputs.s3-secret }}" >> $GITHUB_ENV 
    #    echo "CS_CLIENT_S3_BUCKET=${{ inputs.s3-bucket }}" >> $GITHUB_ENV 
    
    #- name: Win codesign executables
    #  if: ${{ github.event_name != 'pull_request' }}
    #  shell: cmd
    #  run: |
    #    packaging\windows\codesign_client.exe --debug %KLOGG_BUILD_ROOT%\output\ZzLogg.exe
    #    packaging\windows\codesign_client.exe --debug %KLOGG_BUILD_ROOT%\output\tbb12.dll
    #    packaging\windows\codesign_client.exe --debug %KLOGG_BUILD_ROOT%\output\tbbmalloc.dll
    #    packaging\windows\codesign_client.exe --debug %KLOGG_BUILD_ROOT%\output\tbbmalloc_proxy.dll
    
    - name: Stage Windows package files
      shell: cmd
      run: |
        cmake --build %KLOGG_BUILD_ROOT% --target zzlogg_runtime_folder
        if exist release rmdir /s /q release
        xcopy /e /i /y "%KLOGG_BUILD_ROOT%\runtime\RelWithDebInfo\ZzLogg-runtime" release
        xcopy /y "%KLOGG_BUILD_ROOT%\generated\documentation.html" release\
        if exist txpayload rmdir /s /q txpayload
        md txpayload
        xcopy /y "%KLOGG_BUILD_ROOT%\output\ZzLoggUpdateTx.exe" txpayload\
        if not defined SSL_DIR (
          echo SSL_DIR is not set
          exit /b 1
        )
        if not exist "%SSL_DIR%\libcrypto-1_1-x64.dll" (
          echo Missing %SSL_DIR%\libcrypto-1_1-x64.dll
          exit /b 1
        )
        if not exist "%SSL_DIR%\libssl-1_1-x64.dll" (
          echo Missing %SSL_DIR%\libssl-1_1-x64.dll
          exit /b 1
        )
        xcopy /y "%SSL_DIR%\libcrypto-1_1-x64.dll" release\
        xcopy /y "%SSL_DIR%\libssl-1_1-x64.dll" release\
        powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\GenerateNsisUninstallManifest.ps1 -StagingDirectory release
        if errorlevel 1 exit /b %errorlevel%
        powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\GenerateNsisManifest.ps1 -StagingDirectory release
        if errorlevel 1 exit /b %errorlevel%

    - name: Win installer
      shell: cmd
      run: |
        choco install nsis --version=3.11 -y --no-progress
        makensis /NOCD -DVERSION=%KLOGG_VERSION% -DPLATFORM=%KLOGG_ARCH% packaging\windows\ZzLogg.nsi
    
    - name: Win package
      shell: cmd
      run: |
        md %KLOGG_BUILD_ROOT%\packages
        xcopy /e /i /y "%KLOGG_BUILD_ROOT%\runtime\RelWithDebInfo\ZzLogg-runtime" "%KLOGG_BUILD_ROOT%\packages\ZzLogg-%KLOGG_VERSION%-%KLOGG_ARCH%-Qt6-portable"
        xcopy "ZzLogg-%KLOGG_VERSION%-%KLOGG_ARCH%-Qt6-setup.exe" "%KLOGG_BUILD_ROOT%\packages" /y

    #- name: Win codesign installer
    #  if: ${{ github.event_name != 'pull_request' }}
    #  shell: cmd
    #  run: |
    #    packaging\windows\codesign_client.exe --debug %KLOGG_BUILD_ROOT%\packages\ZzLogg-%KLOGG_VERSION%-%KLOGG_ARCH%-Qt6-setup.exe
