name: "Run all tests"
description: "Run tests with ctest"
runs:
  using: "composite"
  steps:

    - name: test
      shell: sh
      run: |
        cd $KLOGG_BUILD_ROOT
        if [ "$RUNNER_OS" = "Windows" ]; then
          # The excluded four fail on hosted runners for reasons unrelated to the
          # code under test; see docs/development/CI_KNOWN_FAILURES.md.
          ctest --verbose -E '^(klogg_itests|zzlogg_ui\.storage_migrator|zzlogg_ui\.windows_installer_contract|zzlogg_ui\.storage_application_smoke|zzlogg_ui\.windows_local_runtime_contract)$'
          # CTest has no REPEAT_UNTIL_PASS test property. Bound retries of
          # this known intermittent parallel-search integration test only.
          ctest --verbose -R '^klogg_itests$' --repeat until-pass:3
        else
          ctest --verbose
        fi
