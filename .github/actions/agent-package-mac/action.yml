name: "Prepare ZzLogg mac packages"
description: "Build and optionally sign macOS application packages"
inputs:
  p12-file-base64:
    required: true
  p12-password:
    required: true
  notarization-username:
    required: true
  notarization-team:
    required: true
  notarization-password:
    required: true
    
runs:
  using: "composite"
  steps:
    - name: Mac prepare codesign
      id: prepare-codesign
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' }}
      uses: apple-actions/import-codesign-certs@v7
      with: 
        p12-file-base64: ${{ inputs.p12-file-base64 }}
        p12-password: ${{ inputs.p12-password }}
     
    - name: Mac deploy Qt
      shell: sh
      run: |
        cd $KLOGG_BUILD_ROOT
        macdeployqt ./output/ZzLogg.app -always-overwrite -verbose=2

    - name: Mac deploy Qt fixing
      if: "startsWith(matrix.config.qt_version, '6')"
      shell: sh
      run: |
        python3 $KLOGG_BUILD_ROOT/macdeployqtfix.py $KLOGG_BUILD_ROOT/output/ZzLogg.app/Contents/MacOS/ZzLogg $QT_ROOT_DIR
    
    - name: Validate Sparkle deployment
      shell: bash
      run: |
        python3 scripts/ci/sign_macos_bundle.py --app "$KLOGG_BUILD_ROOT/output/ZzLogg.app" --verify-layout

    - name: Select signing identity
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' }}
      shell: bash
      env:
        ZZLOGG_SIGNING_TEAM: ${{ inputs.notarization-team }}
      run: |
        python3 - <<'PYTHON'
        import os, re, subprocess
        identities = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning'], text=True)
        team = os.environ['ZZLOGG_SIGNING_TEAM']
        candidates = [(fingerprint, name) for fingerprint, name in
                      re.findall(r'([0-9A-F]{40}) "(Developer ID Application: [^"]+)"', identities)
                      if not team or name.endswith('(' + team + ')')]
        if len(candidates) != 1:
            raise SystemExit('Expected exactly one Developer ID Application identity for the notarization team')
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write('KLOGG_CODESIGN=' + candidates[0][0] + '\n')
        PYTHON

    - name: Set packaging env
      shell: sh
      run: |
        echo "ZZLOGG_DMG=ZzLogg-${{ env.KLOGG_VERSION }}-mac-${{ env.KLOGG_ARCH }}.dmg" >> $GITHUB_ENV
        echo "ZZLOGG_PKG=ZzLogg-${{ env.KLOGG_VERSION }}-mac-${{ env.KLOGG_ARCH }}.pkg" >> $GITHUB_ENV

    - name: Mac codesign binaries
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' }}
      shell: sh
      run: |
        python3 scripts/ci/sign_macos_bundle.py --app "$KLOGG_BUILD_ROOT/output/ZzLogg.app" --identity "$KLOGG_CODESIGN"
    
    - name: Mac pack dmg
      shell: sh
      run: |
        python3 scripts/ci/package_macos_dmg.py --build-root "$KLOGG_BUILD_ROOT" --version "$KLOGG_VERSION"

    # Both unsigned and signed builds must have architecture-specific names.
    - name: Name Mac DMG
      shell: sh
      run: |
        cd $KLOGG_BUILD_ROOT
        mv ./packages/ZzLogg-${{ env.KLOGG_VERSION }}-OSX.dmg ./packages/${{ env.ZZLOGG_DMG }}

    - name: Mac codesign dmg
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' }}
      shell: sh
      run: |
        cd $KLOGG_BUILD_ROOT
        codesign -v -f -o runtime --timestamp -s "${{ env.KLOGG_CODESIGN }}" ./packages/${{ env.ZZLOGG_DMG }}
    
    - name: Mac notarize DMG
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' }}
      shell: bash
      env:
        NOTARY_APPLE_ID: ${{ inputs.notarization-username }}
        NOTARY_TEAM_ID: ${{ inputs.notarization-team }}
        NOTARY_PASSWORD: ${{ inputs.notarization-password }}
      run: |
        set -euo pipefail
        xcrun notarytool submit --wait --output-format json --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" "$KLOGG_BUILD_ROOT/packages/$ZZLOGG_DMG" > dmg_notary.json
        python3 - <<'PYTHON'
        import json, os, subprocess
        result = json.load(open('dmg_notary.json'))
        subprocess.run(['xcrun', 'notarytool', 'log', '--apple-id', os.environ['NOTARY_APPLE_ID'],
                        '--team-id', os.environ['NOTARY_TEAM_ID'], '--password', os.environ['NOTARY_PASSWORD'],
                        result['id'], 'dmg_notary.log.json'], check=True)
        if result.get('status') != 'Accepted':
            raise SystemExit('DMG notarization was not accepted: ' + result.get('status', 'unknown'))
        PYTHON

    - name: Mac staple DMG 
      if: ${{ github.event_name != 'pull_request' && inputs.p12-file-base64 != '' }}
      shell: sh
      run: |
        xcrun stapler staple "${{ env.KLOGG_BUILD_ROOT }}/packages/${{ env.ZZLOGG_DMG }}"

