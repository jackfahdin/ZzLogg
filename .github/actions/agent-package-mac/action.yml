    #    productbuild --package-path ./output --distribution distribution.xml --resources ./pkg_resources --sign "${{ env.KLOGG_INSTALLERSIGN }}" --timestamp ./output/ZzLogg-${{ env.KLOGG_VERSION }}-OSX-product.pkg
