name: "CI Build"

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - latest.json
      - .gitignore
  workflow_dispatch:

jobs:
  SaveVersion:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/klogg-version

      - name: Save version 
        run: echo $KLOGG_VERSION > klogg_version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: klogg_version
          path: 'klogg_version.txt'
          if-no-files-found: error

  Linux:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: 6.11.2
      CC: gcc-13
      CXX: g++-13
      ZZ_GNU_RUNTIME_LICENSE_DIR: ${{ github.workspace }}/build-linux/gcc-runtime-licenses
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/klogg-version
      - name: Install Linux build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build patchelf ragel rpm libgl1-mesa-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-xinerama0-dev libxcb-xkb-dev
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat qtimageformats
          install-deps: false
      - name: Verify CMake toolchain floor
        run: |
          cmake --version
          cmake -P tests/ui_acceptance/cmakeversioncontracttest.cmake
          cmake "-DCOMPILER_VERSION=$(gcc-13 -dumpfullversion)" \
            -P tests/ui_acceptance/compilerversioncontracttest.cmake
      - name: Verify GNU runtime license provenance
        run: |
          mkdir -p "$ZZ_GNU_RUNTIME_LICENSE_DIR"
          curl -fsSL \
            https://raw.githubusercontent.com/gcc-mirror/gcc/releases/gcc-13.3.0/COPYING3 \
            -o "$ZZ_GNU_RUNTIME_LICENSE_DIR/COPYING3"
          curl -fsSL \
            https://raw.githubusercontent.com/gcc-mirror/gcc/releases/gcc-13.3.0/COPYING.RUNTIME \
            -o "$ZZ_GNU_RUNTIME_LICENSE_DIR/COPYING.RUNTIME"
          echo "8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903  $ZZ_GNU_RUNTIME_LICENSE_DIR/COPYING3" | sha256sum --check
          echo "9d6b43ce4d8de0c878bf16b54d8e7a10d9bd42b75178153e3af6a815bdc90f74  $ZZ_GNU_RUNTIME_LICENSE_DIR/COPYING.RUNTIME" | sha256sum --check
      - name: Configure
        run: >-
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DKLOGG_BUILD_UI_TESTS=ON
          -DKLOGG_USE_VECTORSCAN=OFF
          -DKLOGG_USE_HYPERSCAN=OFF
          -DKLOGG_OVERRIDE_MALLOC=OFF
          -DCMAKE_INSTALL_PREFIX=/opt/ZzLogg
          -DZZ_BUNDLE_GNU_RUNTIME=ON
          -DZZ_GNU_RUNTIME_LICENSE_DIR=$ZZ_GNU_RUNTIME_LICENSE_DIR
      - name: Build
        run: cmake --build build-linux --target ci_build --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-linux --output-on-failure
      - name: Stage and verify runtime closure
        run: |
          cmake --install build-linux --prefix "${{ github.workspace }}/stage"
          test -x "${{ github.workspace }}/stage/bin/ZzLogg"
          ldd "${{ github.workspace }}/stage/bin/ZzLogg" | tee ldd.txt
          if grep -q "not found" ldd.txt; then exit 1; fi
      - name: Build Linux DEB and RPM packages
        run: |
          cpack --config build-linux/CPackConfig.cmake -G DEB -B packages
          cpack --config build-linux/CPackConfig.cmake -G RPM -B packages
          deb="packages/ZzLogg-${KLOGG_VERSION}-Linux.deb"
          rpm="packages/ZzLogg-${KLOGG_VERSION}-Linux.rpm"
          test -f "$deb"
          test -f "$rpm"
          test "$(dpkg-deb -f "$deb" Version)" = "$KLOGG_VERSION"
          test "$(rpm -qp --qf '%{VERSION}' "$rpm")" = "$KLOGG_VERSION"
      - name: Validate DEB in clean Ubuntu
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/packages:/packages:ro" \
            ubuntu:24.04 bash -euxo pipefail -c '
              apt-get update
              set -- /packages/ZzLogg-*.deb
              deb=$1
              test -f "$deb"
              package=$(dpkg-deb -f "$deb" Package)
              apt-get install -y desktop-file-utils binutils "$deb"
              unset QT_ROOT_DIR QTDIR LD_LIBRARY_PATH QT_PLUGIN_PATH
              command -v ZzLogg
              dpkg -L "$package" | tee /tmp/zzlogg-package-files.txt
              for owned in \
                /usr/bin/ZzLogg \
                /usr/share/applications/ZzLogg.desktop \
                /usr/share/icons/hicolor/16x16/apps/ZzLogg.png \
                /usr/share/icons/hicolor/512x512/apps/ZzLogg.png \
                /usr/share/icons/hicolor/scalable/apps/ZzLogg.svg \
                /opt/ZzLogg/lib/libstdc++.so.6 \
                /opt/ZzLogg/lib/libgcc_s.so.1 \
                /opt/ZzLogg/share/ZzPureToolsFrame/licenses/gcc-runtime/COPYING3 \
                /opt/ZzLogg/share/ZzPureToolsFrame/licenses/gcc-runtime/COPYING.RUNTIME; do
                grep -Fx "$owned" /tmp/zzlogg-package-files.txt
              done
              desktop-file-validate /usr/share/applications/ZzLogg.desktop
              grep -F "Exec=ZzLogg" /usr/share/applications/ZzLogg.desktop
              app=/opt/ZzLogg/bin/ZzLogg
              test -x "$app"
              test -f /opt/ZzLogg/lib/libQt6Core.so.6
              test -f /opt/ZzLogg/plugins/platforms/libqminimal.so
              test -f /opt/ZzLogg/bin/qt.conf
              ldd "$app" | tee /tmp/zzlogg-ldd.txt
              if grep -q "not found" /tmp/zzlogg-ldd.txt; then exit 1; fi
              qtcore=$(awk "/libQt6Core\\.so\\.6 =>/ {print \$3; exit}" /tmp/zzlogg-ldd.txt)
              test "$(readlink -f "$qtcore")" = "$(readlink -f /opt/ZzLogg/lib/libQt6Core.so.6)"
              stdcxx=$(awk "/libstdc\\+\\+\\.so\\.6 =>/ {print \$3; exit}" /tmp/zzlogg-ldd.txt)
              libgcc=$(awk "/libgcc_s\\.so\\.1 =>/ {print \$3; exit}" /tmp/zzlogg-ldd.txt)
              test "$(readlink -f "$stdcxx")" = "$(readlink -f /opt/ZzLogg/lib/libstdc++.so.6)"
              test "$(readlink -f "$libgcc")" = "$(readlink -f /opt/ZzLogg/lib/libgcc_s.so.1)"
              required=$(find /opt/ZzLogg/bin /opt/ZzLogg/lib -type f -exec readelf --version-info {} \; 2>/dev/null | grep -o "GLIBCXX_[0-9.]*" | sort -V | tail -1)
              test -n "$required"
              strings /opt/ZzLogg/lib/libstdc++.so.6 | grep -Fx "$required"
              QT_DEBUG_PLUGINS=1 ZzLogg -platform minimal >/tmp/zzlogg-smoke.log 2>&1 &
              pid=$!
              sleep 3
              kill -0 "$pid"
              kill "$pid"
              wait "$pid" || true
              grep -F "/opt/ZzLogg/plugins/platforms/libqminimal.so" /tmp/zzlogg-smoke.log
              apt-get remove -y "$package"
              hash -r
              if command -v ZzLogg; then exit 1; fi
              test ! -e /usr/share/applications/ZzLogg.desktop
              test ! -e /usr/share/icons/hicolor/scalable/apps/ZzLogg.svg
            '
      - name: Validate RPM in clean Fedora
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/packages:/packages:ro" \
            fedora:44 bash -euxo pipefail -c '
              set -- /packages/ZzLogg-*.rpm
              rpm_file=$1
              test -f "$rpm_file"
              package=$(rpm -qp --qf "%{NAME}" "$rpm_file")
              dnf install -y desktop-file-utils binutils "$rpm_file"
              unset QT_ROOT_DIR QTDIR LD_LIBRARY_PATH QT_PLUGIN_PATH
              command -v ZzLogg
              rpm -ql "$package" | tee /tmp/zzlogg-package-files.txt
              for owned in \
                /usr/bin/ZzLogg \
                /usr/share/applications/ZzLogg.desktop \
                /usr/share/icons/hicolor/16x16/apps/ZzLogg.png \
                /usr/share/icons/hicolor/512x512/apps/ZzLogg.png \
                /usr/share/icons/hicolor/scalable/apps/ZzLogg.svg \
                /opt/ZzLogg/lib/libstdc++.so.6 \
                /opt/ZzLogg/lib/libgcc_s.so.1 \
                /opt/ZzLogg/share/ZzPureToolsFrame/licenses/gcc-runtime/COPYING3 \
                /opt/ZzLogg/share/ZzPureToolsFrame/licenses/gcc-runtime/COPYING.RUNTIME; do
                grep -Fx "$owned" /tmp/zzlogg-package-files.txt
              done
              desktop-file-validate /usr/share/applications/ZzLogg.desktop
              grep -F "Exec=ZzLogg" /usr/share/applications/ZzLogg.desktop
              app=/opt/ZzLogg/bin/ZzLogg
              test -x "$app"
              test -f /opt/ZzLogg/lib/libQt6Core.so.6
              test -f /opt/ZzLogg/plugins/platforms/libqminimal.so
              test -f /opt/ZzLogg/bin/qt.conf
              ldd "$app" | tee /tmp/zzlogg-ldd.txt
              if grep -q "not found" /tmp/zzlogg-ldd.txt; then exit 1; fi
              qtcore=$(awk "/libQt6Core\\.so\\.6 =>/ {print \$3; exit}" /tmp/zzlogg-ldd.txt)
              test "$(readlink -f "$qtcore")" = "$(readlink -f /opt/ZzLogg/lib/libQt6Core.so.6)"
              stdcxx=$(awk "/libstdc\\+\\+\\.so\\.6 =>/ {print \$3; exit}" /tmp/zzlogg-ldd.txt)
              libgcc=$(awk "/libgcc_s\\.so\\.1 =>/ {print \$3; exit}" /tmp/zzlogg-ldd.txt)
              test "$(readlink -f "$stdcxx")" = "$(readlink -f /opt/ZzLogg/lib/libstdc++.so.6)"
              test "$(readlink -f "$libgcc")" = "$(readlink -f /opt/ZzLogg/lib/libgcc_s.so.1)"
              required=$(find /opt/ZzLogg/bin /opt/ZzLogg/lib -type f -exec readelf --version-info {} \; 2>/dev/null | grep -o "GLIBCXX_[0-9.]*" | sort -V | tail -1)
              test -n "$required"
              strings /opt/ZzLogg/lib/libstdc++.so.6 | grep -Fx "$required"
              QT_DEBUG_PLUGINS=1 ZzLogg -platform minimal >/tmp/zzlogg-smoke.log 2>&1 &
              pid=$!
              sleep 3
              kill -0 "$pid"
              kill "$pid"
              wait "$pid" || true
              grep -F "/opt/ZzLogg/plugins/platforms/libqminimal.so" /tmp/zzlogg-smoke.log
              dnf remove -y "$package"
              hash -r
              if command -v ZzLogg; then exit 1; fi
              test ! -e /usr/share/applications/ZzLogg.desktop
              test ! -e /usr/share/icons/hicolor/scalable/apps/ZzLogg.svg
            '
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: packages/*
          if-no-files-found: error

  Mac:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos
            os_version: 15-intel
            qt_version: 6.11.2
            qt_arch: clang_64
            qt_modules: qt5compat qtimageformats
            arch: x64
            artifacts_id: macos-intel-qt6
            cmake_opts: -DKLOGG_OSX_DEPLOYMENT_TARGET=13.3
          - os: macos
            os_version: 14
            qt_version: 6.11.2
            qt_arch: clang_64
            qt_modules: qt5compat qtimageformats
            arch: arm64
            artifacts_id: macos-arm-qt6
            cmake_opts: -DKLOGG_OSX_DEPLOYMENT_TARGET=14.0

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Xcode
        shell: sh
        run: sudo xcode-select -s /Applications/Xcode.app

#Install build deps
      - name: Set brew env
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        run: |
          brew install ragel
          # GitHub macOS 镜像预装的 brew simdutf 会以 /usr/local/include 抢占
          # vendored 3rdparty/simdutf（-isystem 在 Apple Clang 下输给 /usr/local），
          # 卸载以避免头文件错配（本仓库强制使用 vendored amalgamation）
          brew uninstall --ignore-dependencies simdutf 2>/dev/null || true
          rm -f /usr/local/include/simdutf.h
          rm -rf /usr/local/include/simdutf

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-mac
        with:
          p12-file-base64: ${{ secrets.CODESIGN_BASE64 }}
          p12-password: ${{ secrets.CODESIGN_PASSWORD }}
          notarization-username: ${{ secrets.NOTARIZATION_USERNAME }}
          notarization-team: ${{ secrets.NOTARIZATION_TEAM }}
          notarization-password: ${{ secrets.NOTARIZATION_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*' 
          if-no-files-found: error

  Windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows
            os_version: 2022
            qt_version: 6.11.2
            qt_modules: qt5compat qtimageformats
            qt_arch: win64_msvc2022_64
            arch: x64
            ssl_arch: -x64
            cmake_opts:
            artifacts_id: windows-x64-qt6

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache openssl
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\openssl-1.1
          key: OpensslCache-1-1-1w

      - name: Download openssl
        if: ${{ steps.cache-openssl.outputs.cache-hit != 'true' }} 
        run: |
          Invoke-WebRequest -Uri "https://www.firedaemon.com/download-firedaemon-openssl-1.1.1-zip" -OutFile openssl.zip
          7z x openssl.zip 

      - name: Set openssl paths
        shell: sh
        run: |
          echo "SSL_DIR=${{ github.workspace }}\openssl-1.1\${{ matrix.config.arch }}\bin" >> $GITHUB_ENV
          echo "SSL_ARCH=${{ matrix.config.ssl_arch }}" >> $GITHUB_ENV 

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env
      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests
      - uses: ./.github/actions/agent-package-win
        with:
          s3-key-id: ${{ secrets.WIN_CS_KEY_ID }}
          s3-secret: ${{ secrets.WIN_CS_SECRET }}
          s3-bucket: ${{ secrets.WIN_CS_BUCKET }}
# Final upload of all packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error
