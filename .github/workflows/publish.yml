name: Publish
run-name: ${{ github.event_name == 'push' && github.ref_name || 'Continuous Build' }}

on:
  push:
    tags: ['v*']
  schedule:
    # Request 00:00 Asia/Shanghai; GitHub may delay scheduled runs.
    # Skip unchanged snapshots after a successful publication.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt publication while assets/tag/notes are being updated.
concurrency:
  group: ${{ github.event_name == 'push' && format('release-{0}', github.ref) || 'continuous-build' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.metadata.outputs.mode }}
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      label: ${{ steps.metadata.outputs.label }}
      changed: ${{ steps.metadata.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install update signing test dependency
        run: python -m pip install -r scripts/ci/requirements-update.txt
      - name: Test release helpers
        run: python -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Resolve release inputs
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'stable' || 'nightly' }}
        run: |
          echo "mode=$RELEASE_MODE" >> "$GITHUB_OUTPUT"
          python scripts/ci/prepare_release.py --mode "$RELEASE_MODE"

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/ci-build.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      release_mode: ${{ needs.prepare.outputs.mode }}
    secrets: inherit

  publish:
    # Fixed preview URLs must not change while the feed reads/signs them.
    concurrency:
      group: release-assets-and-update-feed
      cancel-in-progress: false
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble and validate all platform packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ needs.prepare.outputs.label }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/ci/release_assets.py --artifacts artifacts --output release-assets
          --version "$VERSION" --label "$LABEL" --sha "$SOURCE_SHA"
          --tag "$TAG" --run-url "$RUN_URL"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
        run: >-
          python scripts/ci/publish_release.py --repository "$GITHUB_REPOSITORY"
          --directory release-assets --mode "$RELEASE_MODE" --changelog CHANGELOG.md
