name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Do not interrupt publication while assets/tag/notes are being updated.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      label: ${{ steps.metadata.outputs.label }}
      changed: ${{ steps.metadata.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release helpers
        run: python -m unittest discover -s tests/ci -p 'test_*.py'
      - name: Resolve release inputs
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/prepare_release.py --mode stable

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/ci-build.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble and validate all platform packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ needs.prepare.outputs.label }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/ci/release_assets.py --artifacts artifacts --output release-assets
          --version "$VERSION" --label "$LABEL" --sha "$SOURCE_SHA"
          --tag "$TAG" --run-url "$RUN_URL"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/publish_release.py --repository "$GITHUB_REPOSITORY"
          --directory release-assets --mode stable
